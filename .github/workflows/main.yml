name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK without Cache
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "./pulsesms/gradlew" ]; then
            cd pulsesms
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Searching for gradlew..."
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              DIR=$(dirname "$GRADLEW_PATH")
              cd "$DIR"
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              gradle assembleDebug
            fi
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseSMS-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
